name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Two pushes in quick succession would otherwise run two full e2e jobs at once,
# each pulling the Supabase images, seeding through 32 OpenAI embedding calls and
# (on main) making the vision calls. Only the newest ref is worth paying for.
#
# Cancellation stops at `main`. A cancelled run is recorded as "cancelled", not
# "failed", so cancelling on main would let a real regression that the real-engine
# suite was about to catch disappear without ever going red. Paying twice for a
# duplicate run is the cheaper mistake.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 is load-bearing, not caution. The eval-freshness check
      # compares COMMIT timestamps (a fresh checkout rewrites every mtime, so
      # mtimes cannot answer it), and the default single-commit clone leaves
      # `git log` with nothing to compare. The script refuses rather than passing
      # in that case, so removing this line turns the job red, not silently green.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Bun is the package manager; Node is the runtime (CONVENTIONS §29 —
      # dev is Bun, prod is Node, so CI runs the checks on Node to catch divergence).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile

      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build

      # --- The eval gate (CONVENTIONS §13) -------------------------------------
      #
      # Everything in THIS job is free: no model is called, no key is needed. The
      # expensive half lives in `eval-grade` below, on main only, mirroring the
      # cadence already ruled for the real engine (2026-09-07).

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # FIRST, because the rest is meaningless without it. The gate marks a saved
      # RECORDING of what the engine said, so an engine change with no rebuild
      # leaves the gate scoring the old engine and passing. This refuses that
      # build instead of trusting someone to remember.
      - name: The eval dataset must not predate the engine it grades
        run: bash scripts/check-eval-dataset-fresh.sh

      # The free metrics recompute from the answer key on every run, so they can
      # never drift from what a row expects. The judged scores come from the
      # committed file that `eval-grade` produced.
      - name: Eval gate (free metrics + the committed judged scores)
        run: >
          uv run --project evals/ragas ragas-gate
          --dataset evals/ragas/dataset.jsonl
          --scores evals/ragas/scores.json

      - name: The eval harness's own tests
        run: uv run --project evals/ragas pytest evals/ragas/tests -q

  # The cheap regression tier: the same acceptance specs against the deterministic
  # mock engine, on every pull request and every push to `main`. No model reads
  # the invoice here, so a green PR cannot be turned red by a model changing its
  # mind.
  #
  # It is NOT secret-free, despite running no audit model: `bun run seed` embeds
  # the contract corpus through OpenAI, so the job still needs the Doppler `ci`
  # config. Removing that dependency means changing the seed, not this file.
  #
  # `needs: build` because this job starts Docker containers and spends money on
  # embeddings; a lint or type error should fail before any of that begins.
  e2e-mock:
    name: e2e (mock engine)
    runs-on: ubuntu-latest
    needs: build
    # Nothing here is bounded by Playwright: `supabase start` and the browser
    # install sit outside it, and playwright.config.ts sets no globalTimeout, so
    # its globalSetup (db reset + a 32-call seed) can hang indefinitely. The
    # runner default is 6 hours of billed minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dopplerhq/cli-action@v4

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium

      # No `setup-node` here, deliberately (RULED 2026-09-23). Every command in
      # this job is `bun`, `bunx` or `bash`, so pinning Node 22 pinned something
      # nothing read — and a dead setup step reads as Node coverage that does not
      # exist. The Bun-vs-Node divergence CONVENTIONS §29 is guarding against is
      # caught by the post-deploy smoke instead, which drives the artefact that
      # actually ships: one Bun-built bundle, executed by Node, on Vercel. Running
      # this suite under Node would exercise the TypeScript source on Node, which
      # is a third thing that ships nowhere.

      # The suite's own global-setup runs `supabase db reset` and a seed that
      # uploads invoice PDFs to Storage, so CI needs the real local stack, not a
      # bare Postgres (RULED 2026-09-07). Docker is present on ubuntu-latest.
      - name: Start the local Supabase stack
        run: bash .github/scripts/start-supabase.sh

      - name: Run the acceptance suite (mock engine)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -p p1-invoice-audit -c ci -- bun run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-mock
          path: test-results/
          retention-days: 7

  # The real engine: Claude reads the invoice PDF and the contract-terms agent
  # judges the clauses, so this run is non-deterministic and costs model calls.
  # Gated to `main` and manual dispatch (RULED 2026-09-07) so a model's mood can
  # never redden a pull request that changed no code.
  langgraph-e2e:
    name: e2e (langgraph engine)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dopplerhq/cli-action@v4

      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium

      - name: Start the local Supabase stack
        run: bash .github/scripts/start-supabase.sh

      - name: Run the acceptance suite (langgraph engine)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
          AUDIT_ENGINE: langgraph
          PLAYWRIGHT_JSON_OUTPUT_NAME: playwright-report.json
        run: doppler run -p p1-invoice-audit -c ci -- bun run e2e --reporter=list,json

      # The `AUDIT_ENGINE` above is the ONLY thing making the criterion-3 spec
      # execute; it skips itself otherwise. Delete or typo that one line and this
      # job reports "1 skipped, 2 passed", exits 0, and is indistinguishable from
      # the mock job where skipping is correct, so the criterion would be claimed
      # forever by a run that never touched pgvector. A skipped test is not a
      # failure to any runner, so no exit code can catch this. The report can.
      - name: Assert the criterion-3 spec actually ran
        run: bun run scripts/assert-criterion3-ran.ts playwright-report.json

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-langgraph
          path: test-results/
          retention-days: 7

  # The integration tier, minus everything that calls a paid model.
  #
  # Gated to `main` and manual dispatch (RULED 2026-09-23), the same cadence as
  # the real-engine e2e and the judged eval gate, and for the same reason: a
  # model changing its mind must never redden a pull request that changed no
  # code. The six model-calling files are excluded in
  # `vitest.integration-ci.config.ts`, which explains how that list was derived.
  #
  # WHY IT EXISTS: two golden-success criteria are proven ONLY here and by
  # nothing else in CI — durability (a paused audit survives its worker being
  # SIGKILLed and finishes in another process) and tracing (a real run records a
  # real trace URL). Before this job they ran on one laptop, so "proven in CI"
  # was not true of either.
  #
  # It needs the same local Supabase the e2e jobs start, and the same Doppler
  # `ci` config: the seed embeds 32 contract clauses through OpenAI, and
  # `config/env` validates both model keys at import even though this slice
  # never spends them.
  integration:
    name: integration (no paid models)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: dopplerhq/cli-action@v4

      - run: bun install --frozen-lockfile

      # Needed by the SEED, not by the tests. `bun run seed` renders each invoice
      # PDF by launching Chromium, so a job that seeds needs a browser even when
      # nothing in it drives one. Dropped from this job's first version by
      # reasoning about what the tests need, and it failed on the very first CI
      # run with "Executable doesn't exist".
      - run: bunx playwright install --with-deps chromium

      - name: Start the local Supabase stack
        run: bash .github/scripts/start-supabase.sh

      # The tier asserts against seeded rows, so the database must be reset and
      # seeded first — the e2e suite gets this from its own global-setup, which
      # this job does not run.
      - name: Reset and seed
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: |
          bunx supabase db reset --local
          doppler run -p p1-invoice-audit -c ci -- bun run seed

      # REPRODUCE THIS JOB LOCALLY BEFORE PUSHING. The `dev` config has every
      # key; `ci` has a deliberately smaller set, and the difference is invisible
      # until the job runs. Both of this job's first two failures were that gap —
      # a missing browser for the seed, then missing LangSmith credentials for
      # the trace spec, neither reproducible with `-c dev`. From apps/api, with
      # the local stack already up:
      #
      #   eval "$(bunx supabase status -o env)"
      #   doppler run -c ci -- env SUPABASE_URL="$API_URL" \
      #     SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
      #     bunx vitest run --config vitest.integration-ci.config.ts
      #
      # The two SUPABASE_ values are not in any Doppler config: the step above
      # reads them off the started stack, because they belong to an ephemeral
      # container rather than to a hosted project.
      - name: Run the integration tier (model-calling files excluded)
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: doppler run -p p1-invoice-audit -c ci -- bun run test:integration:ci

  # The paid half of the eval gate: Claude re-marks all twenty summaries.
  #
  # Gated to `main` and manual dispatch, the same cadence ruled for the real
  # engine (2026-09-07) and for the same reason: a judged score is
  # non-deterministic, so it must never redden a pull request that changed no
  # code. Every push still gets the free metrics and the freshness check in
  # `build`, which are the parts that catch a broken dataset or a stale one.
  #
  # What re-marking adds over the committed scores: it catches judge DRIFT (the
  # model behind the marker changes and the same prose scores differently) and it
  # catches a scores file that was edited rather than produced. Neither is
  # visible to a run that only reads the committed numbers.
  #
  # `needs: build` because this spends money; a lint error, a stale dataset or a
  # failing threshold should stop it before any of that.
  eval-grade:
    name: eval gate (fresh judged scores)
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: dopplerhq/cli-action@v4

      # Writes fresh scores to a path OUTSIDE the repo copy that is committed, so
      # a green run here can never be mistaken for the committed artefact, and a
      # drifted score shows up as a failure rather than as a quiet file edit.
      - name: Re-mark the summaries with the judge
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}
        run: >
          doppler run -p p1-invoice-audit -c ci --
          uv run --project evals/ragas ragas-gate
          --dataset evals/ragas/dataset.jsonl
          --grade "${RUNNER_TEMP}/fresh-scores.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-fresh-scores
          path: ${{ runner.temp }}/fresh-scores.json
          retention-days: 30
